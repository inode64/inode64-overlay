# Environment for the mcp-redmine service, read by both the systemd unit
# (EnvironmentFile) and the OpenRC script.

# Redmine instance to talk to. Required.
#REDMINE_URL="https://redmine.example.com"

# Each MCP client sends its own Redmine API key in an X-Redmine-API-Key
# header and acts with that user's permissions. A key set here is the
# fallback for clients that send none: leave it unset on a shared server.
#REDMINE_API_KEY=""

# Refuse every request that is not a GET, whatever the user's permissions.
#REDMINE_READ_ONLY="1"

# With a loopback --host the MCP SDK only accepts a Host header naming
# 127.0.0.1 or localhost and answers 421 "Invalid Host header" to any other:
# a reverse proxy in front must not pass the public one on (in Apache, no
# ProxyPreserveHost On).
MCP_REDMINE_OPTS="--transport streamable-http --host 127.0.0.1 --port 8000"
