<IfModule passenger_module>
Listen 3000
<VirtualHost *:3000>
	DocumentRoot /var/lib/redmine/public
#       RailsEnv production
	# Run as redmine, the owner of config/, files/, tmp/ and /var/log/redmine.
	# PassengerDefaultUser is not enough: it is only used when config.ru
	# is owned by root.
	PassengerUser redmine
	PassengerGroup redmine
	<Directory "/var/lib/redmine/public">
		Options FollowSymLinks
		Require all granted
	</Directory>
</VirtualHost>
</IfModule>
