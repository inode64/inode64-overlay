# Upstream's pcp-reboot-init.conf declares /run/pcp, /var/lib/pcp, config/,
# tmp/ and the log directories. systemd-tmpfiles ignores a repeated path with
# other attributes, so this file only adds what upstream leaves out.
d /var/lib/pcp/config/pmchart 775 pcp pcp
d /var/lib/pcp/tmp/bash 775 pcp pcp
d /var/lib/pcp/tmp/mmv 775 pcp pcp
d /var/lib/pcp/tmp/pmcd 775 pcp pcp
d /var/lib/pcp/tmp/pmfind 775 pcp pcp
d /var/lib/pcp/tmp/pmie 775 pcp pcp
d /var/lib/pcp/tmp/pmlogger 775 pcp pcp
d /var/lib/pcp/tmp/pmproxy 775 pcp pcp
d /var/log/pcp/sa 775 pcp pcp
