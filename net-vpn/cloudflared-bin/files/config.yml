# Copy to /etc/cloudflared/config.yml after creating the tunnel with
# "cloudflared tunnel login" and "cloudflared tunnel create <name>".
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/00000000-0000-0000-0000-000000000000.json
logfile: /var/log/cloudflared/tunnel.log
ingress:
  - hostname: tunnel.example.com
    service: http://localhost:8080
  - service: http_status:404
